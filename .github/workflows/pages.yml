name: ChipJev website
on:
  push:
    branches: [main]
    paths: ['website/**', 'demo/**', 'tests/test_demo.py', 'tests/browser/**', 'src/chipjev/**', 'src/chiplaya/**', 'CHIPLAYA.json', 'scripts/sync_chiplaya.py', 'experiments/ptm45/typed-decisions.pt', 'pyproject.toml', 'uv.lock', 'tests/test_chiplaya.py', 'tests/test_decisions.py', 'tests/test_layout.py', 'tests/test_physical.py', 'tests/test_analog_layout.py', '.github/workflows/pages.yml']
  pull_request:
    paths: ['website/**', 'demo/**', 'tests/test_demo.py', 'tests/browser/**', 'src/chipjev/**', 'src/chiplaya/**', 'CHIPLAYA.json', 'scripts/sync_chiplaya.py', 'experiments/ptm45/typed-decisions.pt', 'pyproject.toml', 'uv.lock', 'tests/test_chiplaya.py', 'tests/test_decisions.py', 'tests/test_layout.py', 'tests/test_physical.py', 'tests/test_analog_layout.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chipjev-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - run: uv sync --frozen --python 3.13
      - run: uv pip install --python .venv/bin/python --require-hashes -r demo/requirements.lock
      - run: .venv/bin/ruff check demo src/chipjev src/chiplaya scripts/sync_chiplaya.py tests/test_chiplaya.py tests/test_decisions.py tests/test_layout.py tests/test_demo.py tests/test_physical.py tests/test_analog_layout.py
      - run: .venv/bin/python scripts/sync_chiplaya.py --check
      - run: .venv/bin/python -m pytest -q tests/test_chiplaya.py tests/test_decisions.py tests/test_layout.py tests/test_demo.py tests/test_physical.py tests/test_analog_layout.py -m 'not integration'
      - run: node --check website/app.js
      - run: node --test tests/browser/run-clock.test.mjs

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
