[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chipjev"
version = "0.1.0"
description = "Ultrafast circuit design with a System One decision model and open-source EDA"
requires-python = ">=3.13,<3.14"
dependencies = ["numpy>=2.2,<3"]

[project.optional-dependencies]
apple = ["laya-mlx==0.1.0; sys_platform == 'darwin' and platform_machine == 'arm64'"]
research = [
    "matplotlib>=3.10,<4",
    "psutil>=7,<8",
    "scikit-learn>=1.6,<2",
    "scipy>=1.15,<2",
]
generative = [
    "mlx-lm>=0.29,<1 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]
# GPU surrogates and Laya on PyTorch (CUDA on Linux, MPS/CPU on macOS) and the TPE baseline.
# The extras, dependencies and sources below are pinned by uv.lock, which the frozen
# protocols hash: do not change them (reproduce/verify.py checks uv.lock).
rt = [
    "optuna>=4.5,<5",
    "torch>=2.14,<3",
    "tokenizers>=0.22,<1",
    "safetensors>=0.6,<1",
    "huggingface-hub>=0.34,<2",
    "transformers>=4.57,<6",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1"]

[project.scripts]
chipjev = "chipjev.cli:main"

[tool.uv]
python-preference = "only-managed"

[tool.uv.sources]
laya-mlx = { git = "https://github.com/mizorewww/laya-mlx", rev = "fc1df62828a3fedf4d8229fdac1cbd85f1cdf337" }
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/chipjev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: runs the installed ngspice (and xschem) binaries",
    "frozen: reruns the probe on the frozen code (reproduce/frozen.py)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
